spring:
  application:
    name: payroll
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    datatype:
      datetime:
        # serialise java.time.Duration as ISO 8601 (PT152H30M) instead of numeric seconds
        write-durations-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

payroll:
  import:
    enabled: true
    initial-delay: 10s
    interval: 5m
  time-tracking:
    # identifiers of the demo employees in the fictitious external system
    employee-references: TT-1001,TT-1002,TT-1003
    months: 3

logging:
  level:
    dev.svitzthum.payroll: DEBUG
