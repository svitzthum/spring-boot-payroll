services:
  postgres:
    image: 'postgres:18-alpine'
    environment:
      POSTGRES_DB: payroll
      POSTGRES_USER: payroll
      POSTGRES_PASSWORD: payroll
    ports:
      - '5432:5432'
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U payroll -d payroll' ]
      interval: 5s
      timeout: 5s
      retries: 10

